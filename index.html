<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-face-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>

  <body>
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="pinturaRosto" src="pinturapng.png">
      </a-assets>

      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-face-target="anchorIndex: 168">
        
        <a-entity mindar-face-mesh material="src: #pinturaRosto; transparent: true; opacity: 0.9"></a-entity>

        <a-text 
          value="Junto com o Brasil.\nVem Hexa!" 
          align="center" 
          color="#FFD700" 
          position="0 0.4 0" 
          scale="0.4 0.4 0.4">
        </a-text>

      </a-entity>
    </a-scene>
  </body>
</html>
